name: hydrated_mobx_example
description: "Showcase of every hydrated_mobx 2.0 feature."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.13.0"

dependencies:
  flutter:
    sdk: flutter
  hydrated_mobx:
    path: ../
  mobx: ^2.5.0
  flutter_mobx: ^2.0.6+5
  path_provider: ^2.1.2
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  build_runner: ^2.3.3
  mobx_codegen: ^2.0.7+3

flutter:
  uses-material-design: true
