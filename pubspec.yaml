name: hydrated_mobx
description: 'An extension to the MobX state management library which automatically persists and restores MobX states.'
version: 2.0.0
homepage: https://github.com/NarekManukyan/hydrated_mobx
repository: https://github.com/NarekManukyan/hydrated_mobx.git
issue_tracker: https://github.com/NarekManukyan/hydrated_mobx/issues
documentation: https://github.com/NarekManukyan/hydrated_mobx#readme

topics:
  - mobx
  - state-management
  - persistence
  - storage
  - hydration

screenshots:
  - description: A counter store keeps its value after the app is killed and relaunched.
    path: doc/screenshots/demo.gif
  - description: The example app, one screen per feature.
    path: doc/screenshots/01_home.webp
  - description: 100 rapid changes cost 1 write with persistDelay, and re-creating a store costs none.
    path: doc/screenshots/03_write_stats.webp
  - description: Session and account boxes; signing out clears only the session.
    path: doc/screenshots/04_namespaces.webp
  - description: A versioned store migrating v2 data and reporting it to the observer.
    path: doc/screenshots/05_migration.webp
  - description: A per-item cache bounded by maxEntries, with an entry that is never evicted.
    path: doc/screenshots/06_eviction.webp
  - description: One HydratedObserver logging every store's errors and migrations.
    path: doc/screenshots/07_observer.webp
  - description: Every key in every storage, live.
    path: doc/screenshots/08_inspector.webp
  - description: Time per write of a 2000-row state, with and without trustToJson.
    path: doc/screenshots/09_trust_to_json.webp
  - description: An AES-256 encrypted box.
    path: doc/screenshots/10_encryption.webp

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  hive_ce: ^2.0.0
  meta: ^1.3.0
  mobx: ^2.5.0
  synchronized: ^3.0.0

dev_dependencies:
  build_runner: ^2.3.3
  collection: ^1.17.1
  crypto: ^3.0.2
  freezed: ^2.3.2
  freezed_annotation: ^2.2.0
  json_annotation: ^4.8.0
  json_serializable: ^6.6.1
  mocktail: ^1.0.0
  path: ^1.8.3
  test: ^1.22.2
  uuid: ^3.0.7
